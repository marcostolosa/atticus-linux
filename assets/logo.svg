<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Atticus">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b1230"/>
      <stop offset="1" stop-color="#0c0a18"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.42" r="0.62">
      <stop stop-color="#a78bfa"/>
      <stop offset="0.55" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4c2bd6"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="160" height="160" rx="38" fill="url(#tile)"/>
  <rect x="0.75" y="0.75" width="158.5" height="158.5" rx="37.25" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- listening rings -->
  <g stroke="#7c5cff" fill="none" stroke-linecap="round">
    <circle cx="80" cy="80" r="40" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="80" cy="80" r="54" stroke-opacity="0.16" stroke-width="2"/>
    <circle cx="80" cy="80" r="68" stroke-opacity="0.08" stroke-width="2"/>
  </g>

  <!-- core orb -->
  <circle cx="80" cy="80" r="26" fill="url(#orb)" filter="url(#glow)"/>
  <circle cx="72" cy="71" r="8" fill="#ffffff" fill-opacity="0.35"/>
</svg>
